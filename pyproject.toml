[project]
name = "hostmon"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beta", email = "qwantone@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiogram>=3.32.0",
    "apscheduler>=3.11.3",
    "certifi>=2026.10.23",
    "cryptography>=50.0.2",
    "niquests>=3.21.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    #    "uvloop>=0.23.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[project.scripts]
hostmon = "hostmon:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
